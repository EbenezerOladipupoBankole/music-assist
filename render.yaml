services:
  # 1. The FastAPI Backend
  - type: web
    name: music-assist-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
      - key: OPENAI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: music-assist-frontend
          property: host

  # 2. The Frontend (React/Vite)
  - type: web
    name: music-assist-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: music-assist-backend
          property: host
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyDe6oPQht4Fl5iWcoZhVaDIxkuaqCwAky8
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: music-assists.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: music-assists
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: music-assists.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: 276698594895
      - key: VITE_FIREBASE_APP_ID
        value: 
