[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
exclude = ["venv", "scripts/manual"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# main.py must extend sys.path before importing sibling modules (config, routers, etc.)
"main.py" = ["E402"]
